name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The longbridge/nsh commit Mado is built and tested with (RichEditor).
  NSH_REF: 71fa71099cde1dfa2c48ef1e0d97a028b9698df9

jobs:
  app:
    name: Type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nsh
        with:
          ref: ${{ env.NSH_REF }}
      - run: nsh check .
      - run: nsh build . --release
      - run: nsh test .

  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unix installer tests
        if: runner.os != 'Windows'
        run: python scripts/test-install.py
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Windows installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
