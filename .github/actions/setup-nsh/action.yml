name: Set up NSH
description: >-
  Checks out longbridge/nsh at the commit NSH_REV names into .nsh-src, applies
  packaging/patches, builds the nsh command line and puts it on PATH.
  `.cargo/config.toml` patches every nsh crate to .nsh-src, so nsh-richtext,
  the example's crate and the hosts nsh builds for them share that NSH.
inputs:
  web:
    description: Add the wasm32 target for the web build.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read the pinned NSH commit
      id: rev
      shell: bash
      run: echo "rev=$(cat NSH_REV)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: longbridge/nsh
        ref: ${{ steps.rev.outputs.rev }}
        path: .nsh-src
        persist-credentials: false
    - name: Apply the NSH patches
      shell: bash
      run: |
        # Windows checkouts may have CRLF; the patches and their sources must agree.
        git -C .nsh-src -c core.autocrlf=false checkout-index --all --force
        for patch in packaging/patches/*.patch; do [ -e "$patch" ] || continue; git -C .nsh-src apply "$GITHUB_WORKSPACE/$patch"; done
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.web == 'true' && 'wasm32-unknown-unknown' || '' }}
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libssl-dev
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .nsh-src -> target
          . -> target
        key: nsh-${{ steps.rev.outputs.rev }}-${{ inputs.web }}
    - name: Build the nsh CLI
      shell: bash
      working-directory: .nsh-src
      run: |
        # Windows' rustc may overflow its stack on the `windows` crate.
        if [ "$RUNNER_OS" = Windows ]; then echo "RUST_MIN_STACK=268435456" >> "$GITHUB_ENV"; export RUST_MIN_STACK=268435456; fi
        cargo build --locked --release -p nsh-cli
        echo "$PWD/target/release" >> "$GITHUB_PATH"
